[workspace]
members = [
    "crates/munshi",
    "crates/munshi-dashboard",
    "crates/munshi-probe",
    "crates/munshi-runner",
    "crates/munshi-transcript",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4.5.41", features = ["derive"] }
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
libc = "0.2.174"
rusqlite = { version = "0.37.0", features = ["bundled"] }
# TLS for the Caddy-published endpoints (ADR 0013): rustls on the `ring` provider — identical
# behavior on macOS and Linux, no cmake/asm build surprises — verifying against the system
# trust store via rustls-native-certs, which is also the private-CA extension point.
rustls = { version = "0.23.29", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-native-certs = "0.8.1"
serde = { version = "1.0.219", features = ["derive"] }
# `preserve_order` keeps user key order intact when Munshi rewrites foreign JSON files it merges
# into (Claude Code's `~/.claude/settings.json`).
serde_json = { version = "1.0.141", features = ["preserve_order"] }
sha2 = "0.10.9"
tempfile = "3.20.0"
thiserror = "2.0.12"
toml = "0.8.19"
# First compression dependency: archive-upload artifacts are zstd-compressed before transfer, with
# both the original and stored (compressed) size and sha256 recorded per artifact (ADR 0009).
zstd = "0.13.3"
